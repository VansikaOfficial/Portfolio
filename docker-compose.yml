version: '3.9'

# Optional one-command local dev stack. Not required for the Vercel/Render/Neon
# deployment path described in the root README — this is purely a local convenience.
#
# Usage:
#   1. cp backend/.env.example backend/.env   (set DB_HOST=db)
#   2. cp frontend/.env.example frontend/.env.local
#   3. docker compose up --build
#   4. docker compose exec backend npm run migration:run
#   5. docker compose exec backend npm run seed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_cms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    ports:
      - '5000:5000'
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    ports:
      - '3000:3000'

volumes:
  pgdata:
  backend_uploads:
